name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.23.4
          - 24.22.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The development host SDK requires Node 24, even when checking the
          # compiled plugin's compatibility with an older Node runtime.
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Packed host install on the SDK-supported runtime
        if: matrix.node-version == '22.23.4'
        run: npm run pack:smoke
      - uses: actions/setup-node@v5
        if: matrix.node-version == '22.23.4'
        with:
          node-version: 22.23.4
      - name: Node 22 plugin compatibility
        if: matrix.node-version == '22.23.4'
        run: |
          npm run check
          npm test
          npm run release:test
          npm run plugin:ci
      - name: Full host preflight
        if: matrix.node-version == '24.22.1'
        run: npm run preflight
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plugin-inspector-reports-node-${{ matrix.node-version }}
          path: reports/plugin-inspector-*
          if-no-files-found: warn
